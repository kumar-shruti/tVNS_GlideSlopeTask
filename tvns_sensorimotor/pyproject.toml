[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tvns_sensorimotor"
version = "1.0.0"
description = "Analysis pipeline for the arousal-linked tVNS sensorimotor-adaptation study"
requires-python = ">=3.9"
dependencies = [
    "pandas>=1.3",
    "numpy>=1.21",
    "scipy>=1.7",
    "statsmodels>=0.13",
    "scikit-learn>=1.0",
    "matplotlib>=3.4",
    "mne>=1.0",
]

[tool.setuptools]
packages = ["tvns_sensorimotor"]

[tool.pytest.ini_options]
filterwarnings = ["ignore"]
